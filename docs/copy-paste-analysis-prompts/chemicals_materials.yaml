copy_paste_prompt: |-
  Investment analysis prompt:
  - Template: chemicals_materials
  - Company name: [COMPANY_NAME].
  - Company type: chemicals_materials.
  - Exchange: [EXCHANGE_CODE].
  - Keep outputs decision-grade, evidence-linked, and explicit about assumptions.

  - Run a dedicated sector lane (chemicals/materials): capture 2-4 recent sources on feedstock costs, product spreads, capacity additions, demand, energy prices, and regulation; tie each point to scenario assumptions.
  Exchange assumptions:
  Exchange profile: listing venue not preselected. Infer filing sources from the company's exchange, domicile, regulator, and primary documents; do not assume one exchange-specific filing format by default.

  Analysis rubric:
  Data sourcing rules:
  * If source documents are not attached, actively retrieve and review primary sources before analysis.
  * Source market data from official exchange sources, regulator filings, and reliable market-data providers for the listing venue.
  * Source company, project, operating, financial, and industry data from primary regulator filings, official exchange announcements, and company investor materials.
  * Prioritise exchange filings, annual/interim reports, quarterly updates, investor presentations, official company materials, regulator filings, and named primary-source documents.
  * Use secondary sources only where they add factual context not available in primary filings; label secondary-source facts clearly.
  * For every key numeric input used in valuation, Quality, Value, or price targets, provide:
    1) value used
    2) source URL + document date
    3) ESTIMATE tag with one-line justification if inferred.
  * Use current listing currency market and sector inputs and relevant base-currency FX conversion where project economics are reported in a different currency where relevant; state source and timestamp.

  Run an investment analysis on [COMPANY_NAME] using this chemicals & materials rubric. If data is unavailable, state the gap, explain whether it matters to valuation, and continue. Do not penalise missing disclosure unless the missing item is material to earnings quality, cash-flow durability, balance-sheet risk, regulation, operating execution, or scenario confidence.

  First classify the business:
  * Commodity chemicals/fertilizers: value driven by cycle position, feedstock, utilization, global capacity, and product spreads.
  * Specialty chemicals/materials: value driven by formulation/IP, customer stickiness, pricing, mix, and margin resilience.
  * Explosives/mining services: value driven by mining volumes, contract structure, ammonium nitrate capacity, and safety/reliability.
  * Industrial gases: value driven by take-or-pay contracts, onsite pipeline networks, capex, and return on capital.

  Use that classification to decide valuation emphasis:
  * Commodity chemicals: normalized mid-cycle EBITDA/FCF and cost-curve position, not peak spreads.
  * Specialty materials: margin quality, pricing power, customer retention, and R&D/product pipeline.
  * Industrial gases: contracted cash flow, project backlog, ROIC, and balance-sheet capacity.
  * Explosives/fertilizer: spread sensitivity, feedstock pass-through, and volume reliability.

  Include:
  * 12-month and 24-month price targets with bull/base/bear scenarios.
  * Quality and Value scores out of 100 using the formulas and scoring tables below.
  * Operating summary and timeline to the next material regulatory, operating, financial, or strategic milestones.
  * Quantitative and qualitative headwinds/tailwinds with explicit thresholds and directional valuation impact.
  * Investment recommendation (BUY/HOLD/SELL), conviction (HIGH/MEDIUM/LOW), and one-paragraph justification.
  * Key risks, key opportunities, monitoring watchlist, and verification queue.

  Document review (complete before valuation):
  For each major valuation-relevant document (annual/interim report, quarterly update, investor presentation, technical report, financing update, operating update, regulatory filing, or material announcement), provide:
  * Document title/date/announcement reference.
  * 4-6 extracted key points.
  * Relevance to valuation inputs (what changed and why it matters).
  * Implications for investment outlook (positives and negatives).
  * Market pricing assessment: one separate paragraph on whether market pricing appears to reflect the document's information.

  Step 1: Business Model and Earnings-Quality Workup
  * Establish the current revenue, earnings, cash-flow, balance-sheet, and capital-allocation baseline from primary evidence.
  * Separate recurring, contracted, regulated, transactional, commodity-linked, project, and one-off earnings streams. Do not value them with one blended multiple if their quality differs.
  * Identify the 3-5 variables that actually move valuation for this company.
  * Distinguish reported growth from organic growth, price/mix, volume, M&A, FX, working-capital timing, and accounting noise.
  * Build a timeline to the next events that can change the thesis.

  Sector-specific operating metrics to capture where relevant:
  * Product spreads, feedstock/energy costs, utilization, capacity additions, plant reliability, turnarounds.
  * Contract structure, pass-through clauses, customer/end-market mix, R&D, product pipeline, safety incidents.
  * EBITDA margin, FCF conversion, maintenance/growth capex, net debt, environmental liabilities.

  Sector-specific caution points:
  * Do not value peak spreads as sustainable without supply/demand evidence.
  * Do not ignore feedstock, energy, environmental, safety, or shutdown risks.
  * Separate specialty-margin earnings from commodity-cycle earnings.

  Step 2: Valuation Workup
  * State the primary valuation anchor and why it is appropriate.
  * Cross-check with at least one secondary method.
  * Normalize earnings or cash flow where cycle position, one-offs, commodity prices, rates, or project timing distort the current period.
  * Explain whether EBITDA, earnings, FCF, NAV, book value, AUM, reserves, or capacity metrics overstate or understate owner earnings.
  * Do not let peer multiples override company-specific evidence on quality, leverage, growth, cyclicality, governance, or cash conversion.

  Step 3: Quality Score (0-100)
  Score the company explicitly across these factors. Show raw score, weighting, weighted contribution, and a short evidence-based reason for each.

  Quality factor weightings:
  * Cost Curve Position: 20%
  * Product Mix Quality: 20%
  * Pricing/Spread Resilience: 15%
  * Asset Reliability: 15%
  * Balance Sheet: 15%
  * Governance: 15%

  Quality scoring formula:
  * Quality Score = sum(weighted factor scores), 0-100.

  Quality grading bands:
  * 85-100: top-tier business with durable economics, strong evidence, resilient balance sheet, and clear execution.
  * 70-84: good business with clear strengths and manageable risks.
  * 50-69: mixed quality; attractive elements offset by cycle, execution, funding, or disclosure concerns.
  * Below 50: weak economics, weak evidence, or material governance/balance-sheet risk.

  Step 4: Value Score (0-100)
  Score the company explicitly across these factors. Show raw score, weighting, weighted contribution, and a short evidence-based reason for each.

  Value factor weightings:
  * Cycle-Normalized Earnings vs Market Cap: 30%
  * EV/EBITDA vs Peers: 20%
  * FCF Yield: 20%
  * Asset Replacement Value: 15%
  * Strategic Value: 15%

  Value scoring formula:
  * Value Score = sum(weighted factor scores), 0-100.

  Value grading bands:
  * 85-100: materially undervalued relative to normalized fundamentals and risk.
  * 70-84: undervalued with clear upside and manageable risks.
  * 50-69: roughly fair value or upside offset by risk.
  * Below 50: expensive or weakly supported by fundamentals.

  Step 5: Scenario Framework and Price Targets
  Provide bull, base, and bear cases with:
  * 12M target and 24M target.
  * Probability for each scenario.
  * Short description of what operationally changes.
  * Current positioning (bull-leaning, base-leaning, mixed, bear-leaning).
  * Explicit conditions that must hold.
  * Explicit failure conditions.

  Scenario design rules:
  * Bull/base/bear must differ by operating assumptions, balance-sheet outcomes, and valuation evidence, not only by exit multiple.
  * Tie each scenario to measurable trigger conditions the scenario router can later monitor.
  * State which assumptions are known, estimated, or disputed.

  Cross-check requirements before final output:
  * Ensure scenario targets reconcile to current share count, enterprise value, net debt/cash, and currency.
  * Ensure valuation does not double-count cash, debt, capex, funding gaps, or one-off earnings.
  * Ensure missing data is handled as a verification item, not as a silent assumption.
