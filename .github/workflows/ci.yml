name: CI

on:
  push:
    branches: ["master", "uplift/**", "codex/**"]
  pull_request:
    branches: ["master"]

jobs:
  backend-lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev deps
        run: pip install ".[dev]"
      - name: Ruff check
        run: ruff check backend/ --select E,F,I --ignore E501

  backend-compile:
    name: Compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -e "."
      - name: Compile all backend modules
        run: |
          find backend -name "*.py" -not -path "*/__pycache__/*" \
            | xargs python3 -m py_compile && echo "All modules compile OK"

  backend-test:
    name: Tests (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev deps
        run: pip install -e ".[dev]"
      - name: Run unit tests
        # Unit tests only — integration tests require live API keys
        run: pytest tests/unit/ -x -q --timeout=30
        env:
          OPENROUTER_API_KEY: "test-key"
          TAVILY_API_KEY: "test-key"
