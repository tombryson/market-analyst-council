id: construction_engineering
name: Construction & Engineering
description: Investment analysis for contractors, EPC, infrastructure builders, developers, and engineering services companies
category: industrials
version: '1.0'
author: LLM Council
company_types:
- construction_engineering
template_behavior:
  commodity_profile: none
  supplementary_sector_label: construction and engineering sector
  cashflow_schema:
    mode: auto
    min_reporting_periods: 3
    require_operating_cashflow: true
    detection_max_sources: 28
  stage1_research_lanes:
  - 'Run a dedicated sector lane (construction/engineering): capture 2-4 recent sources on infrastructure spend, tender activity,
    labour/material costs, contract risk, and project finance; tie each point to scenario assumptions.'
  stage3_scoring_factors:
    quality:
    - Backlog Quality
    - Execution Discipline
    - Contract Risk
    - Cash Conversion
    - Balance Sheet
    - Governance
    value:
    - Normalized Earnings vs Market Cap
    - Backlog Margin Quality
    - FCF Yield
    - Asset/Development Value
    - Strategic Value
auto_detect_keywords:
- construction
- engineering
- contractor
- epc
- epcm
- infrastructure project
- order book
- backlog
- tender
- claims
- work in progress
- wip
- contract asset
inputs:
- ticker
- company_name
- market_data
- pdf_documents
output_schema:
  type: object
  required_fields:
  - analysis_type
  - ticker
  - company_name
  - quality_score
  - value_score
  - price_targets
  - investment_recommendation
  structure:
    analysis_type: construction_engineering
    ticker: string
    company_name: string
    analysis_date: ISO-8601
    market_data:
      current_price: float
      market_cap_m: float
      shares_outstanding_m: float
      enterprise_value_m: float
      currency: string
    quality_score:
      total: float (0-100)
      breakdown: object
    value_score:
      total: float (0-100)
      breakdown: object
    price_targets:
      current_price: float
      scenario_targets: object
      scenario_probabilities: object
      prob_weighted_target_12m: float
      prob_weighted_target_24m: float
    development_timeline: array
    monitoring_watchlist: object
    thesis_map: object
    management_competition_assessment: object
    verification_required_fields: array
    investment_recommendation:
      rating: BUY/HOLD/SELL
      conviction: HIGH/MEDIUM/LOW
      summary: string
