id: transport_logistics
name: Transport & Logistics
description: Investment analysis for airlines, rail, shipping, freight, ports, logistics, and supply-chain operators
category: industrials
version: '1.0'
author: LLM Council
company_types:
- transport_logistics
template_behavior:
  commodity_profile: none
  supplementary_sector_label: transport and logistics sector
  cashflow_schema:
    mode: auto
    min_reporting_periods: 3
    require_operating_cashflow: true
    detection_max_sources: 28
  stage1_research_lanes:
  - 'Run a dedicated sector lane (transport/logistics): capture 2-4 recent sources on freight/passenger demand, fuel prices,
    labour, capacity, rates, and supply-chain conditions; tie each point to scenario assumptions.'
  stage3_scoring_factors:
    quality:
    - Route/Network Quality
    - Cycle Resilience
    - Cost Control
    - Asset Utilization
    - Balance Sheet
    - Governance
    value:
    - Normalized Earnings vs Market Cap
    - EV/EBITDA vs Peers
    - FCF Yield
    - Asset/Network Value
    - Strategic Value
auto_detect_keywords:
- transport
- logistics
- airline
- rail
- freight
- shipping
- port
- container
- pallet
- fleet
- load factor
- yield
- tonne kilometres
- supply chain
