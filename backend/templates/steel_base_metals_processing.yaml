id: steel_base_metals_processing
name: Steel & Base Metals Processing
description: Investment analysis for steel producers, metal recyclers, downstream metal processors, and base-metals processing
  companies
category: materials
version: '1.0'
author: LLM Council
company_types:
- steel_base_metals_processing
template_behavior:
  commodity_profile: none
  supplementary_sector_label: steel and base-metals processing sector
  cashflow_schema:
    mode: auto
    min_reporting_periods: 3
    require_operating_cashflow: true
    detection_max_sources: 28
  stage1_research_lanes:
  - 'Run a dedicated sector lane (steel/base-metals processing): capture 2-4 recent sources on steel/base-metal prices, scrap
    spreads, energy costs, construction/auto demand, capacity utilization, and trade policy; tie each point to scenario assumptions.'
  stage3_scoring_factors:
    quality:
    - Cost Curve Position
    - Asset/Plant Quality
    - End-Market Exposure
    - Cash Conversion
    - Balance Sheet
    - Governance
    value:
    - Cycle-Normalized Earnings vs Market Cap
    - EV/EBITDA vs Peers
    - FCF Yield
    - Replacement/Asset Value
    - Strategic Value
