id: agriculture_agribusiness
name: Agriculture & Agribusiness
description: Investment analysis for agribusiness, grain handlers, crop inputs, rural services, food commodities, and agricultural
  processors
category: agriculture
version: '1.0'
author: LLM Council
company_types:
- agriculture_agribusiness
template_behavior:
  commodity_profile: none
  supplementary_sector_label: agriculture and agribusiness sector
  cashflow_schema:
    mode: auto
    min_reporting_periods: 3
    require_operating_cashflow: true
    detection_max_sources: 28
  stage1_research_lanes:
  - 'Run a dedicated sector lane (agribusiness): capture 2-4 recent sources on crop conditions, weather, soft commodity prices,
    fertilizer/input costs, trade flows, and biosecurity/policy risk; tie each point to scenario assumptions.'
  stage3_scoring_factors:
    quality:
    - Supply Chain Position
    - Commodity/Crop Exposure
    - Margin Resilience
    - Working Capital Discipline
    - Balance Sheet
    - Governance
    value:
    - Normalized Earnings vs Market Cap
    - Asset/Network Value
    - FCF Yield
    - Cycle-Adjusted Multiple
    - Strategic Value
auto_detect_keywords:
- agriculture
- agribusiness
- grain
- crop
- fertilizer
- fertiliser
- rural services
- farm input
- seed
- agchem
- food processor
- harvest
- soft commodity
