id: coal_miner
name: Coal Miner
description: Investment analysis for thermal and metallurgical coal miners
category: resources
version: '1.0'
author: LLM Council
company_types:
- coal_miner
template_behavior:
  commodity_profile: coal
  supplementary_sector_label: coal mining sector
  cashflow_schema:
    mode: auto
    min_reporting_periods: 3
    require_operating_cashflow: true
    detection_max_sources: 28
  stage1_research_lanes:
  - 'Run a dedicated sector-macro lane (coal): capture 2-4 recent sources on thermal/met coal prices, China/India demand,
    steel cycle, energy security, freight, ESG finance constraints, and regulation; tie each point to scenario assumptions.'
  stage3_scoring_factors:
    quality:
    - Asset/Reserve Quality
    - Cost Curve Position
    - Market Access
    - Management
    - Funding/Balance Sheet
    - ESG/Regulatory Risk
    value:
    - NAV vs Market Cap
    - EV/Reserve Tonne
    - FCF Yield Through Cycle
    - Cost Competitiveness
    - Capital Return Capacity
auto_detect_keywords:
- coal
- thermal coal
- metallurgical coal
- met coal
- coking coal
- pci coal
- seaborne coal
- mine plan
- strip ratio
- coal price
- steelmaking coal
inputs:
- ticker
- company_name
- market_data
- pdf_documents
