  supplementary_sector_label: media and publishing sector
  cashflow_schema:
    mode: auto
    min_reporting_periods: 3
    require_operating_cashflow: true
    detection_max_sources: 28
  stage1_research_lanes:
  - 'Run a dedicated sector lane (media/publishing): capture 2-4 recent sources on ad markets, subscriber trends, streaming/linear
    shifts, print decline, content costs, and platform/regulatory changes; tie each point to scenario assumptions.'
  stage3_scoring_factors:
    quality:
    - Audience/Brand Quality
    - Revenue Mix Durability
    - Cost Discipline
    - Digital Transition
    - Balance Sheet
    - Governance
    value:
    - Normalized Earnings vs Market Cap
    - EV/EBITDA vs Peers
    - FCF Yield
    - Subscriber/Audience Value
    - Strategic Value
