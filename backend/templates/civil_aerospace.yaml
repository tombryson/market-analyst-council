id: civil_aerospace
name: Civil Aerospace
description: Investment analysis for commercial aerospace OEMs, engines, suppliers, lessors, and aftermarket aviation businesses
category: industrials
version: '1.0'
author: LLM Council
company_types:
- civil_aerospace
template_behavior:
  commodity_profile: none
  supplementary_sector_label: civil aerospace sector
  cashflow_schema:
    mode: auto
    min_reporting_periods: 3
    require_operating_cashflow: true
    detection_max_sources: 28
  stage1_research_lanes:
  - 'Run a dedicated sector lane (civil aerospace): capture 2-4 recent sources on aircraft deliveries, airline capex, engine
    issues, supply-chain constraints, certification, traffic, and aftermarket demand; tie each point to scenario assumptions.'
  stage3_scoring_factors:
    quality:
    - Backlog/Program Quality
    - Aftermarket Exposure
    - Execution/Safety
    - Supply Chain Resilience
    - Balance Sheet
    - Governance
    value:
    - Normalized Earnings vs Market Cap
    - EV/EBITDA vs Peers
    - FCF Yield
    - Installed Base/Aftermarket Value
    - Strategic Value
