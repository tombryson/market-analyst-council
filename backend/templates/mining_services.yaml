template_behavior:
  commodity_profile: none
  supplementary_sector_label: mining services sector
  cashflow_schema:
    mode: auto
    min_reporting_periods: 3
    require_operating_cashflow: true
    detection_max_sources: 32
  stage1_research_lanes:
  - 'Run a dedicated sector lane (mining services): capture 2-4 recent sources on mining capex, exploration drilling, production activity, contract mining demand, equipment utilisation, labour availability, and commodity-exposed customer budgets; tie each point to scenario assumptions.'
  - 'Run a customer-cycle lane: identify the company''s key commodity and customer exposures, contract renewals, project starts/stops, tender pipeline, order book, pricing, margin, and working-capital risk.'
  stage3_scoring_factors:
    quality:
    - Revenue Visibility
    - Contract Quality
    - Utilisation and Execution
    - Cash Conversion
    - Balance Sheet
    - Customer and Commodity Diversification
    value:
    - Normalized Earnings vs Market Cap
    - EV/EBITDA vs Cycle and Peers
    - FCF Yield
    - Fleet/Asset Replacement Value
    - Strategic Value
