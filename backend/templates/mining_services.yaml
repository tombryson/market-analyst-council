rubric: |
  Run an investment analysis on [Company Name] using this mining services rubric. Use this template for contract miners, drillers, blasting/explosives suppliers, mining equipment hire, mine-site services, maintenance, camps, logistics, and EPCM/service providers to the mining sector. Do not analyse these businesses as miners unless they own the resource, reserve, mine, or commodity production economics themselves.

  The centre of the analysis is not resource tonnes or commodity ownership. It is service earnings quality: contract duration, customer budgets, utilisation, pricing, margins, working capital, fleet intensity, safety, and exposure to mining capex/opex cycles.

  First classify the business:
  * Contract mining: value driven by contract duration, mobilisation, fleet intensity, cost pass-through, customer concentration, margin discipline, and renewal risk.
  * Drilling services: value driven by rig utilisation, metres drilled, day rates, exploration/development budgets, labour availability, safety, and fleet productivity.
  * Blasting/explosives/mining consumables: value driven by mine production volumes, pricing formulas, ammonium nitrate/input costs, reliability, safety, and regulatory constraints.
  * Equipment hire and maintenance: value driven by fleet age, utilisation, rental rates, residual value, maintenance intensity, and customer mine activity.
  * Mining EPCM / engineering services: value driven by project pipeline, billable utilisation, skill availability, tender wins, change orders, and execution risk.
  * Hybrid provider: separate each earnings stream rather than applying one blended multiple.

  Use that classification to decide valuation emphasis:
  * Asset-light service models: EV/EBIT, FCF yield, and organic growth adjusted for utilisation and labour margins.
  * Fleet-heavy models: EV/EBITDA and FCF after maintenance capex, with explicit fleet replacement-cycle and residual-value checks.
  * Contract mining: normalized EBIT/FCF with explicit adjustment for mobilisation costs, contract assets/liabilities, claims, and working capital.
  * Consumables/explosives: cycle-normalized margins, pricing spread, input-cost pass-through, capacity/reliability, and safety/regulatory risk.
  * Do not give premium value to backlog unless margin quality, counterparty quality, and cash conversion are visible.

  Include:
  * 12-month and 24-month price targets with bull/base/bear scenarios.
  * Quality and Value scores out of 100 using the formulas and scoring tables below.
  * Operating summary and timeline to material contract, utilisation, guidance, balance-sheet, customer-budget, or strategic milestones.
  * Monitoring watchlist and thesis map with conditions the scenario router can evaluate later.
  * Investment recommendation (BUY/HOLD/SELL), conviction (HIGH/MEDIUM/LOW), and one-paragraph justification.
  * Verification queue for missing contract, utilisation, margin, cash-flow, capex, or customer concentration data.

  Step 1: Business Model and Earnings-Quality Workup
  * Establish the current revenue, EBITDA/EBIT, cash-flow, net debt/cash, order book/backlog, and guidance baseline from primary evidence.
  * Separate recurring contract revenue, transactional project work, consumables, equipment rental, maintenance, and one-off earnings streams.
  * Identify the 3-5 variables that actually move valuation for this company.
  * Distinguish reported growth from organic volume, price/rate, utilisation, M&A, FX, commodity customer budgets, working-capital timing, and accounting noise.
  * Map key customer and commodity exposures. State whether earnings are tied mostly to exploration capex, development capex, sustaining mine opex, production volumes, or mine expansions.
  * Build a timeline to the next events that can change the thesis: contract awards/renewals, mobilisation, demobilisation, guidance updates, margin recovery, capex cycle, customer project approvals, covenant milestones, or strategic transactions.

  Sector-specific operating metrics to capture where relevant:
  * Order book/backlog, contract tenor, renewal dates, tender pipeline, customer concentration, commodity exposure, margin by segment.
  * Utilisation, rig/fleet count, metres drilled, day rates/rental rates, mobilisation status, maintenance capex, fleet age, downtime.
  * Safety metrics, labour availability, subcontractor exposure, cost pass-through, fuel/steel/AN/input costs, claims/change orders, debtor days, working capital.
  * Net debt/cash, lease liabilities, equipment finance, covenant headroom, dividend/buyback policy, and acquisition appetite.

  Sector-specific caution points:
  * Do not treat mining-services revenue as direct commodity exposure. Service companies can benefit from mining activity while still suffering margin pressure, labour shortages, bad debt, or customer deferrals.
  * Do not treat backlog as value unless margin, counterparty quality, and cash conversion are credible.
  * Do not penalise the absence of JORC resource data for a pure service company. Resource data matters only through customer budget and project activity exposure.
  * Do not ignore working capital. Mining-services earnings often look healthy before receivables, mobilisation costs, inventory, contract assets, and capex absorb cash.
  * Separate maintenance capex from growth capex for fleet-heavy companies.

  Step 2: Valuation Workup
  * State the primary valuation anchor and why it is appropriate.
  * Cross-check with at least one secondary method.
  * Normalize earnings or cash flow where cycle position, one-offs, commodity budgets, rates, labour costs, or contract timing distort the current period.
  * Explain whether EBITDA, earnings, FCF, backlog, fleet value, or replacement value overstates or understates owner earnings.
  * Do not let peer multiples override company-specific evidence on utilisation, contract quality, leverage, cash conversion, safety, customer concentration, governance, or cycle exposure.

  Step 3: Quality Score (0-100)
  Score the company explicitly across these factors. Show raw score, weighting, weighted contribution, and a short evidence-based reason for each.

  Quality factor weightings:
  * Revenue Visibility: 20%
  * Contract Quality: 20%
  * Utilisation and Execution: 15%
  * Cash Conversion: 15%
  * Balance Sheet: 15%
  * Customer and Commodity Diversification: 15%

  Quality scoring formula:
  * Quality Score = sum(weighted factor scores), 0-100.

  Quality grading bands:
  * 85-100: top-tier service business with durable contracts, strong utilisation, cash-backed earnings, resilient balance sheet, and diversified customers.
  * 70-84: good business with clear strengths and manageable cycle/execution risks.
  * 50-69: mixed quality; attractive demand offset by utilisation, margin, working-capital, leverage, customer, or disclosure risks.
  * Below 50: weak economics, poor cash conversion, high leverage, customer concentration, safety/execution issues, or weak evidence.

  Step 4: Value Score (0-100)
  Score the company explicitly across these factors. Show raw score, weighting, weighted contribution, and a short evidence-based reason for each.

  Value factor weightings:
  * Normalized Earnings vs Market Cap: 30%
  * EV/EBITDA vs Cycle and Peers: 20%
  * FCF Yield: 20%
  * Fleet/Asset Replacement Value: 15%
  * Strategic Value: 15%

  Value scoring formula:
  * Value Score = sum(weighted factor scores), 0-100.

  Value grading bands:
  * 85-100: materially undervalued relative to normalized earnings, cash generation, asset value, and risk.
  * 70-84: undervalued with clear upside and manageable cycle/execution risks.
  * 50-69: roughly fair value or upside offset by risk.
  * Below 50: expensive, weakly supported by fundamentals, or dependent on unsupported cycle/margin assumptions.

  Step 5: Scenario Framework and Price Targets
  Provide bull, base, and bear cases with:
  * 12M target and 24M target.
  * Probability for each scenario.
  * Short description of what operationally changes.
  * Current positioning (bull-leaning, base-leaning, mixed, bear-leaning).
  * Explicit conditions that must hold.
  * Explicit failure conditions.

  Scenario design rules:
  * Bull/base/bear must differ by utilisation, contract wins/losses, margins, cash conversion, customer budget cycle, balance sheet, and valuation evidence, not only by exit multiple.
  * Tie each scenario to measurable trigger conditions the scenario router can later monitor.
  * State which assumptions are known, estimated, or disputed.

  Cross-check requirements before final output:
  * Ensure scenario targets reconcile to current share count, enterprise value, net debt/cash, lease liabilities, and currency.
  * Ensure valuation does not double-count cash, debt, leases, fleet value, capex, acquisition synergies, or one-off earnings.
  * Ensure missing data is handled as a verification item, not as a silent assumption.

copy_paste_rubric: |
  Run an investment analysis on [Company Name] using the Mining Services LLM Council template.

  Use this for contract mining, mineral drilling, blasting/explosives, mining equipment hire, maintenance, mine-site services, camps/logistics, and mining EPCM. Do not treat the company as a miner unless it owns the resource or production economics.

  Focus on service earnings quality: contract duration, customer budgets, utilisation, pricing, margins, working capital, fleet intensity, safety, and mining capex/opex exposure. Include bull/base/bear 12M and 24M price targets, Quality Score, Value Score, thesis map, timeline, monitoring watchlist, and verification queue.
