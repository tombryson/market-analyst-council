id: utilities
name: Utilities
description: Investment analysis for regulated utilities, electricity, gas, water, networks, and gentailers
category: utilities
version: '1.0'
author: LLM Council
company_types:
- utilities
template_behavior:
  commodity_profile: none
  supplementary_sector_label: utilities sector
  cashflow_schema:
    mode: auto
    min_reporting_periods: 3
    require_operating_cashflow: true
    detection_max_sources: 28
  stage1_research_lanes:
  - 'Run a dedicated sector lane (utilities): capture 2-4 recent sources on allowed returns, regulation, energy prices, grid
    investment, interest rates, and policy risk; tie each point to scenario assumptions.'
  stage3_scoring_factors:
    quality:
    - Regulatory Framework
    - Asset Base Quality
    - Earnings Resilience
    - Capital Structure
    - Execution
    - Governance
    value:
    - Regulated Asset Value vs Market Cap
    - Dividend/FCF Support
    - Allowed Return vs WACC
    - Growth Capex Quality
    - Strategic Infrastructure Value
