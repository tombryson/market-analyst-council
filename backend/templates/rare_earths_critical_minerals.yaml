id: rare_earths_critical_minerals
name: Rare Earths & Critical Minerals
description: Investment analysis for rare earths and critical minerals companies with supply-chain, processing, and geopolitical
  exposure
category: resources
version: '1.0'
author: LLM Council
company_types:
- rare_earths_critical_minerals
template_behavior:
  commodity_profile: rare_earths
  supplementary_sector_label: rare earths and critical minerals sector
  cashflow_schema:
    mode: auto
    min_reporting_periods: 3
    require_operating_cashflow: true
    detection_max_sources: 28
  stage1_research_lanes:
  - 'Run a dedicated sector-macro lane (rare earths/critical minerals): capture 2-4 recent sources on NdPr/REE pricing, China
    policy, western supply-chain funding, offtake, processing capacity, and defence/energy demand; tie each point to scenario
    assumptions.'
  stage3_scoring_factors:
    quality:
    - Resource/Processing Quality
    - Strategic Supply Chain Position
    - Permitting/Jurisdiction
    - Management
    - Funding/Balance Sheet
    - ESG
    value:
    - Risked NAV vs Market Cap
    - EV/Resource Unit
    - Separation/Processing Optionality
    - Strategic/Policy Value
    - Offtake/Funding Value
