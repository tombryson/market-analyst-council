id: education
name: Education
description: Investment analysis for education providers, testing, student placement, publishing/courseware, tutoring, and
  workforce training companies
category: consumer
version: '1.0'
author: LLM Council
company_types:
- education
template_behavior:
  commodity_profile: none
  supplementary_sector_label: education sector
  cashflow_schema:
    mode: auto
    min_reporting_periods: 3
    require_operating_cashflow: true
    detection_max_sources: 28
  stage1_research_lanes:
  - 'Run a dedicated sector lane (education): capture 2-4 recent sources on enrolments, visa/regulatory settings, student
    demand, funding policy, employment cycle, and digital learning trends; tie each point to scenario assumptions.'
  stage3_scoring_factors:
    quality:
    - Brand/Outcome Quality
    - Regulatory Position
    - Student/Customer Economics
    - Revenue Durability
    - Balance Sheet
    - Governance
    value:
    - Normalized Earnings vs Market Cap
    - EV/EBITDA vs Peers
    - FCF Yield
    - Platform/Brand Value
    - Strategic Value
auto_detect_keywords:
- education
- university
- student
- enrolment
- enrollment
- testing
- ielts
- courseware
- tutoring
- vocational
- training
- edtech
- international student
