id: crypto_digital_assets
name: Crypto & Digital Assets
description: Investment analysis for crypto exchanges, miners, custody, infrastructure, treasury companies, and digital asset
  platforms
category: technology
version: '1.0'
author: LLM Council
company_types:
- crypto_digital_assets
template_behavior:
  commodity_profile: none
  supplementary_sector_label: crypto and digital assets sector
  cashflow_schema:
    mode: auto
    min_reporting_periods: 3
    require_operating_cashflow: true
    detection_max_sources: 28
  stage1_research_lanes:
  - 'Run a dedicated sector lane (crypto/digital assets): capture 2-4 recent sources on crypto prices, ETF/flow trends, regulation,
    mining difficulty/hashprice, stablecoin policy, custody/security, and exchange volumes; tie each point to scenario assumptions.'
  stage3_scoring_factors:
    quality:
    - Regulatory/Compliance Position
    - Platform/Infrastructure Quality
    - Revenue Durability
    - Balance Sheet/Treasury Risk
    - Security/Operational Risk
    - Governance
    value:
    - Cycle-Normalized Earnings vs Market Cap
    - Asset/Treasury Value
    - FCF Yield
    - Platform Optionality
    - Strategic Value
auto_detect_keywords:
- crypto
- digital assets
- bitcoin
- btc
- ethereum
- eth
- exchange volume
- custody
- blockchain
- hashrate
- hash rate
- mining difficulty
- hashprice
- stablecoin
- staking
- coinbase
- bitcoin miner
inputs:
- ticker
- company_name
- market_data
- pdf_documents
output_schema:
