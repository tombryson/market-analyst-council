id: forestry_paper_packaging
name: Forestry, Paper & Packaging
description: Investment analysis for forestry, pulp, paper, fibre packaging, rigid/flexible packaging, and recycling-linked
  packaging companies
category: materials
version: '1.0'
author: LLM Council
company_types:
- forestry_paper_packaging
template_behavior:
  commodity_profile: none
  supplementary_sector_label: forestry paper and packaging sector
  cashflow_schema:
    mode: auto
    min_reporting_periods: 3
    require_operating_cashflow: true
    detection_max_sources: 28
  stage1_research_lanes:
  - 'Run a dedicated sector lane (forestry/packaging): capture 2-4 recent sources on pulp/paper prices, OCC/recycled fibre,
    timber, packaging demand, e-commerce, energy costs, and sustainability regulation; tie each point to scenario assumptions.'
  stage3_scoring_factors:
    quality:
    - Fibre/Asset Quality
    - Packaging Franchise Quality
    - Margin Resilience
    - Sustainability/Regulatory Position
    - Balance Sheet
    - Governance
    value:
    - Normalized Earnings vs Market Cap
    - EV/EBITDA vs Peers
    - FCF Yield
    - Timberland/Asset Value
    - Strategic Value
