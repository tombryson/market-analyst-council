id: iron_ore_miner
name: Iron Ore Miner
description: Investment analysis for iron ore miners and iron-ore-dominant resource companies
category: resources
version: '1.0'
author: LLM Council
company_types:
- iron_ore_miner
template_behavior:
  commodity_profile: iron_ore
  supplementary_sector_label: iron ore mining sector
  cashflow_schema:
    mode: auto
    min_reporting_periods: 3
    require_operating_cashflow: true
    detection_max_sources: 28
  stage1_research_lanes:
  - 'Run a dedicated sector-macro lane (iron ore): capture 2-4 recent sources on iron ore price, China steel demand, port
    inventories, freight, grade premiums/discounts, and cost curve; tie each point to scenario assumptions.'
  stage3_scoring_factors:
    quality:
    - Jurisdiction/Infrastructure
    - Resource/Reserve Quality
    - Cost Curve Position
    - Management
    - Funding/Balance Sheet
    - ESG/Permitting
    value:
    - NAV vs Market Cap
    - EV/Reserve or Resource Tonne
    - Cost Competitiveness
    - Expansion Optionality
    - Strategic Value
auto_detect_keywords:
- iron ore
- hematite
- magnetite
- fe grade
- dso
- pellet feed
- sinter fines
- benchmark 62
- steel demand
- port inventory
- pilbara
