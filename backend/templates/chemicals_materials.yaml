id: chemicals_materials
name: Chemicals & Materials
description: Investment analysis for chemicals, fertilizers, explosives, industrial gases, and specialty materials companies
category: materials
version: '1.0'
author: LLM Council
company_types:
- chemicals_materials
template_behavior:
  commodity_profile: none
  supplementary_sector_label: chemicals and materials sector
  cashflow_schema:
    mode: auto
    min_reporting_periods: 3
    require_operating_cashflow: true
    detection_max_sources: 28
  stage1_research_lanes:
  - 'Run a dedicated sector lane (chemicals/materials): capture 2-4 recent sources on feedstock costs, product spreads, capacity
    additions, demand, energy prices, and regulation; tie each point to scenario assumptions.'
  stage3_scoring_factors:
    quality:
    - Cost Curve Position
    - Product Mix Quality
    - Pricing/Spread Resilience
    - Asset Reliability
    - Balance Sheet
    - Governance
    value:
    - Cycle-Normalized Earnings vs Market Cap
    - EV/EBITDA vs Peers
    - FCF Yield
    - Asset Replacement Value
    - Strategic Value
auto_detect_keywords:
- chemical
- chemicals
- materials
- fertilizer
- fertiliser
- ammonia
- urea
- explosives
- industrial gas
- specialty materials
- feedstock
- spread
- ethylene
- polymer
