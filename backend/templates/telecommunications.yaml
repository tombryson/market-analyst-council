    - Network Quality
    - Subscriber Economics
    - Pricing Power
    - Capital Intensity
    - Balance Sheet
    - Governance
    value:
    - DCF/FCF vs Market Cap
    - EV/EBITDA vs Peers
    - Dividend Capacity
    - Infrastructure Optionality
    - Strategic Value
